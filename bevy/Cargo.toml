[package]
name = "tome-bevy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "ui"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rand = "0.8"
# notes.rs timestamp_now: localtime_r for the original's local-time stamps.
libc = "0.2"

# Fast compiles for the game crate, fast runtime for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
